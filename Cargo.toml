[workspace]
resolver = "2"
members = [
  "crates/autopilot-domain",
  "crates/autopilot-policy",
  "crates/autopilot-audit",
  "crates/autopilot-router",
  "crates/autopilot-runtime",
  "crates/autopilot-core",
  "apps/autopilot-cli",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
authors = ["OPEN AUTOPILOT contributors"]

[workspace.dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
