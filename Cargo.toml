[workspace]
resolver = "2"
members = [
  "crates/autopilot-domain",
  "crates/autopilot-policy",
  "crates/autopilot-audit",
  "crates/autopilot-router",
  "crates/autopilot-runtime",
  "crates/autopilot-core",
  "crates/autopilot-harness",
  "crates/autopilot-workspace",
  "crates/autopilot-verification",
  "crates/autopilot-fleet",
  "crates/autopilot-engine",
  "crates/autopilot-delivery",
  "crates/autopilot-store",
  "crates/autopilot-missions",
  "crates/autopilot-recovery",
  "crates/autopilot-computer-use",
  "crates/autopilot-plugins",
  "crates/autopilot-plugin-runtime",
  "crates/autopilot-plugin-builder",
  "crates/autopilot-semantic-planner",
  "crates/autopilot-automation",
  "crates/autopilot-automation-runtime",
  "crates/autopilot-secrets",
  "crates/autopilot-control-plane",
  "crates/autopilot-connectors",
  "crates/autopilot-capability-graph",
  "apps/autopilot-cli",
]
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
authors = ["OPEN AUTOPILOT contributors"]

[workspace.dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
